<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Zvieracia aréna</title>
  <!-- PWA: „Pridať na plochu“ = hra beží na celú obrazovku bez lišty prehliadača
       (jediná cesta k fullscreenu na iOS Safari; Android to vie aj tlačidlom ⛶). -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#7ec8ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Aréna">
  <link rel="stylesheet" href="style.css?v=d852ee89">
</head>
<body>
  <!-- ☰ = mobilné menu počas hry (hlavička sa na mobile v hre zbalí do
       overlayu; nová hra, zvuk, celá obrazovka a jazyk sú za týmto tlačidlom). -->
  <button id="menuBtn" class="menu-btn" aria-label="Menu">☰</button>
  <header>
    <h1 id="title">⚔️ Zvieracia aréna</h1>
    <div class="controls">
      <button id="fsBtn" aria-label="Celá obrazovka">⛶</button>
      <button id="muteBtn" aria-label="Zvuk">🔊</button>
      <!-- Stlmenie hlášok bota (trash-talk bubliny), hra beží ďalej -->
      <button id="botMuteBtn" aria-label="Hlášky bota">💬</button>
      <button id="newGameBtn" class="danger hidden">Nová hra</button>
      <!-- Môj balíček: na mobile v ☰ menu (desktop má dropdown vpravo od dosky) -->
      <button id="deckBtn" class="deck-btn"></button>
    </div>
  </header>

  <main>
    <!-- Výber obtiažnosti (superschopnosti hrdinu prídu neskôr) -->
    <section id="pickScreen">
      <div class="pick-box">
        <h2 id="diffTitle">Ako silný má byť súper?</h2>
        <div id="diffPick" class="diff-pick"></div>
        <!-- Claude súper: API kľúč hráča (len localStorage) + profil hráča -->
        <div id="claudeSetup" class="claude-setup hidden">
          <label id="claudeKeyLabel" for="claudeKey"></label>
          <input id="claudeKey" type="password" autocomplete="off" placeholder="sk-ant-…">
          <div id="claudeKeyNote" class="claude-note"></div>
        </div>
        <!-- Meno hráča (vždy pred hrou; pamätá sa). „Hubko" vidí ladenie rýchlosti. -->
        <div class="name-row">
          <label id="playerNameLabel" for="playerName"></label>
          <input id="playerName" type="text" autocomplete="off" maxlength="24">
        </div>
        <button id="startBtn" class="primary big-btn">Hraj!</button>
        <div class="net-row">
          <button id="netBtn">📶 Hraj s kamarátom (sieť)</button>
          <!-- Návrat do rozohranej sieťovej hry (kód je v localStorage) -->
          <button id="rejoinBtn" class="hidden"></button>
        </div>
        <!-- Mutácie sú vždy vypnuté a ban rasy vždy zapnutý (bez checkboxu). -->
        <!-- Hmyz: experimentálna rasa, default vypnutá; v hre po sieti rozhoduje zakladateľ. -->
        <label class="mut-toggle"><input type="checkbox" id="insectToggle"> <span id="insectToggleLbl"></span></label>
        <!-- Trinkety: ponuka trvalého bonusu v kole 4 a 8; v hre po sieti rozhoduje zakladateľ. -->
        <label class="mut-toggle"><input type="checkbox" id="trinketToggle"> <span id="trinketToggleLbl"></span></label>
        <!-- Verzia: čas buildu (version.js) + posledný commit z GitHubu. -->
        <div id="versionBox" class="version-box"></div>
      </div>
      <!-- Pravidlá hry – obsah generuje game.js (trojjazyčne). -->
      <div id="rulesBox" class="rules-box"></div>
    </section>

    <!-- Čakanie na súpera (hra po sieti / kód miestnosti) -->
    <div id="netOverlay" class="overlay hidden">
      <div class="win-box">
        <div class="big">📶</div>
        <div id="netMsg"></div>
        <div id="netUrls" class="net-urls"></div>
        <div id="peerSetup" class="hidden">
          <button id="peerHostBtn" class="primary">🎲</button>
          <div id="peerCode" class="peer-code"></div>
          <div class="peer-join">
            <input id="peerCodeInput" maxlength="4" inputmode="numeric" placeholder="1234">
            <button id="peerJoinBtn">▶</button>
          </div>
        </div>
        <button id="netCancel"></button>
      </div>
    </div>

    <!-- Herná obrazovka: doska (stage) s pozadím PlayGround.png -->
    <section id="gameScreen" class="hidden">
      <div class="log" id="logEl"></div>
      <!-- Môj balíček (desktop): scrollovací dropdown vpravo vedľa dosky -->
      <div class="deck-dd" id="deckDd">
        <button id="deckDdBtn"></button>
        <div id="deckDdList" class="deck-list hidden"></div>
      </div>
      <div id="stage">
        <div class="hero-plate top" id="oppHero"></div>
        <div class="board opp" id="oppBoard"></div>

        <div class="corner tl" id="oppDeckBox"></div>
        <div class="corner bl" id="oppDiscardBox"></div>
        <!-- Pravidlo dnešnej arény (mutácia) – medzi súperovým balíčkom a kôpkou -->
        <div class="mutator hidden" id="mutatorBox"></div>
        <div class="corner tr" id="myDiscardBox"></div>
        <!-- Pečate (aury) súpera – vpravo hore nad kôpkou -->
        <div class="opp-aura hidden" id="oppAura"></div>
        <div class="corner br" id="myDeckBox"></div>

        <div class="shop-panel" id="shopPanel">
          <div class="shop-rows">
            <div class="shop-row" id="commonsRow"></div>
            <div class="shop-row private" id="privRow"></div>
          </div>
          <div class="shop-head">
            <span id="turnBanner" class="banner"></span>
            <span class="head-btns">
              <button id="refreshBtn">🔄</button>
              <button id="freezeBtn">❄️</button>
              <button id="tierBtn">⬆️</button>
              <button id="buyBackBtn" class="hidden">↩️</button>
              <!-- Štít hrdinu (trinket): raz za hru, boj bez zranenia -->
              <button id="shieldBtn" class="shield-btn hidden">🛡️</button>
              <!-- Zabanovaná rasa: preškrtnutá ikonka rasy (ťuk = pripomenutie v logu) -->
              <button id="banBox" class="ban-ic hidden"></button>
            </span>
            <span class="aura" id="auraEl" title="Aury"></span>
            <span class="money" id="moneyEl"></span>
          </div>
        </div>

        <button id="endTurnBtn" class="primary end-turn">✅</button>
        <div id="fightBanner" class="fight-banner hidden">⚔️</div>
        <div class="board mine" id="myBoard"></div>
        <div class="hand" id="handEl"></div>
        <div class="hero-plate bottom" id="myHero"></div>
        <!-- Pravidlo rasy, ktorú hráč hrá (Hmyz: roj, Ogri: backstab) – pod tierom. -->
        <div class="race-note hidden" id="myRaceNote"></div>
      </div>
      <!-- Rýchlosť animácií – len pre hráča „Hubko" (ladenie počas hry). -->
      <div id="speedRow" class="speed-row hidden">
        <label for="speedRange" id="speedLbl"></label>
        <span>🐢</span><input id="speedRange" type="range" min="0.25" max="4" step="0.25" value="1"><span>🐇</span>
        <b id="speedVal">1×</b>
      </div>
      <!-- Ladenie (len hráč „Hubko"): ľubovoľná karta zadarmo do ruky. -->
      <div id="devPanel" class="dev-panel hidden">
        <b id="devTitle"></b>
        <select id="devFilter"></select>
        <input id="devSearch" type="search" autocomplete="off">
        <select id="devCard" size="10"></select>
        <div class="dev-give">
          <select id="devRank"><option value="1">1×</option><option value="2">2× 🥈</option><option value="3">4× 🥇</option></select>
          <button id="devGiveBtn" class="primary"></button>
        </div>
      </div>
      <!-- Chat s Claudom (len Claude mód) – odpoveď príde bublinou -->
      <div id="chatRow" class="chat-row hidden">
        <input id="chatInput" type="text" maxlength="200" autocomplete="off">
        <button id="chatSend">💬</button>
      </div>
    </section>

    <!-- Fáza BAN: výber rasy, ktorá v hre nebude -->
    <div id="banOverlay" class="overlay hidden">
      <div class="win-box">
        <div class="big" id="banTitle"></div>
        <div id="banMsg" class="ban-msg"></div>
        <div class="ban-row" id="banRow"></div>
      </div>
    </div>

    <!-- Ponuka trinketov (kolo 4 a 8): tri karty s trvalým bonusom -->
    <div id="trinketOverlay" class="overlay hidden">
      <div class="win-box">
        <div class="big" id="trinketTitle"></div>
        <div id="trinketMsg" class="ban-msg"></div>
        <div class="trinket-row" id="trinketRow"></div>
      </div>
    </div>

    <!-- Discover overlay -->
    <div id="discoverOverlay" class="overlay hidden">
      <div class="win-box">
        <div class="big" id="discoverTitle"></div>
        <div class="shop-row" id="discoverRow"></div>
      </div>
    </div>

    <!-- Evolve zo skrytých kópií (balíček/kôpka) -->
    <div id="evolveOverlay" class="overlay hidden">
      <div class="win-box">
        <div class="big">✨</div>
        <div id="evolveMsg"></div>
        <button id="evolveOk" class="primary">OK</button>
      </div>
    </div>

    <!-- Koniec hry -->
    <!-- Môj balíček (mobil): dialóg so scrollom, zavrie sa a hra pokračuje -->
    <div id="deckOverlay" class="overlay hidden">
      <div class="win-box">
        <div class="big" id="deckTitle"></div>
        <div id="deckHint" class="ban-msg"></div>
        <div id="deckOvList" class="deck-list"></div>
        <button id="deckClose" class="primary"></button>
      </div>
    </div>
    <div id="overOverlay" class="overlay hidden">
      <div class="win-box">
        <div class="big" id="overTitle"></div>
        <div id="overMsg"></div>
        <button id="overAgain" class="primary"></button>
      </div>
    </div>
  </main>

  <footer><span id="footNote"></span></footer>

  <script src="version.js?v=42cfa6cd"></script>
  <script src="vendor/peerjs.min.js?v=7e60515a"></script>
  <script src="src/i18n.js?v=bb554ff5"></script>
  <script src="src/net.js?v=f8a1c39c"></script>
  <script src="src/sfx.js?v=00b87990"></script>
  <script src="src/cards.js?v=b09f4aa3"></script>
  <script src="src/cards-insect.js?v=292727b1"></script>
  <script src="src/engine.js?v=76ede0bf"></script>
  <script src="src/bot.js?v=0c15b3b1"></script>
  <script src="src/claude-bot.js?v=38413432"></script>
  <script src="src/game.js?v=7feddc79"></script>
  <!-- Šach popri hre (desktop): pravidlá chess.js (MIT), UI src/chess.js -->
  <script src="vendor/chess.min.js?v=0.10.3"></script>
  <script src="src/chess.js?v=24b5cf89"></script>
</body>
</html>
